name: CI

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 22.1.7 (clang-format)
        run: |
          Invoke-WebRequest -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.7/LLVM-22.1.7-win64.exe" -OutFile llvm.exe
          7z x llvm.exe -ollvm -y | Out-Null
          Add-Content -Path $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE\llvm\bin"

      - name: Check clang-format
        run: |
          $cf = "$env:GITHUB_WORKSPACE\llvm\bin\clang-format.exe"
          & $cf --version
          $files = Get-ChildItem -Path src -Recurse -Include *.cpp,*.h,*.hpp | Select-Object -ExpandProperty FullName
          foreach ($f in $files) { & $cf --style=file -i $f }
          $changed = git diff --name-only
          if ($changed) {
            Write-Host "clang-format violations in:"
            $changed | ForEach-Object { Write-Host "  $_" }
            git diff
            exit 1
          }


  build-debug:
    needs: lint
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/debug/_deps
          key: fetchcontent-debug-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: fetchcontent-debug-

      - name: Configure CMake
        run: cmake -B build/debug -A x64

      - name: Build
        run: cmake --build build/debug --config Debug --parallel

      - name: Run Tests
        working-directory: build/debug
        run: ctest -C Debug --output-on-failure

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-debug
          path: build/debug/Testing/

  build-release:
    needs: lint
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/release/_deps
          key: fetchcontent-release-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: fetchcontent-release-

      - name: Configure CMake
        run: cmake -B build/release -A x64

      - name: Build
        run: cmake --build build/release --config Release --parallel

      - name: Install OpenCppCoverage
        run: |
          choco install opencppcoverage --no-progress -y
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\OpenCppCoverage"

      - name: Run Tests with Coverage
        run: >
          OpenCppCoverage.exe
          --sources "${{ github.workspace }}\src"
          --export_type=cobertura:build/release/coverage.xml
          -- ctest --test-dir build/release -C Release --output-on-failure

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: build/release/coverage.xml
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-release
          path: build/release/Testing/

  build-asan:
    needs: lint
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/asan/_deps
          key: fetchcontent-asan-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: fetchcontent-asan-

      - name: Configure CMake (ASAN Debug)
        run: >
          cmake -B build/asan -A x64
          -DENABLE_ASAN=ON
          -DCMAKE_CXX_FLAGS_DEBUG="/Ob0 /Od"

      - name: Build
        run: cmake --build build/asan --config Debug --parallel

      - name: Test (ASAN)
        working-directory: build/asan
        env:
          ASAN_OPTIONS: "halt_on_error=1:abort_on_error=1"
        # Exclude OS-level storage tests that may produce false positives from Win32 APIs
        run: ctest -C Debug --output-on-failure -E "DriveEnumerator|Indexer"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-debug, build-release]
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: fetchcontent-release-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: fetchcontent-release-

      - name: Configure CMake
        run: cmake -B build -A x64 -DCMAKE_INSTALL_PREFIX=install

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Install
        run: cmake --install build --config Release

      - name: Package (ZIP portable)
        run: cpack -G ZIP -C Release
        working-directory: build

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Package (NSIS installer)
        run: cpack -G NSIS -C Release
        working-directory: build

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.zip
            build/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
