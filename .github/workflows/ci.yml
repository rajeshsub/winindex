name: CI

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  schedule:
    # Re-check pinned dependencies for advisories disclosed after they were pinned (rule 18).
    - cron: '0 6 * * 1'

jobs:
  dep-vuln-scan:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check dependency vulnerabilities (OSV.dev)
        shell: pwsh
        run: ./scripts/check_dep_vulns.ps1

  lint:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install LLVM 22.1.7 (clang-format, clang-tidy)
        run: |
          Invoke-WebRequest -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.7/LLVM-22.1.7-win64.exe" -OutFile llvm.exe
          7z x llvm.exe -ollvm -y | Out-Null
          Add-Content -Path $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE\llvm\bin"

      - name: Check clang-format
        run: |
          $cf = "$env:GITHUB_WORKSPACE\llvm\bin\clang-format.exe"
          & $cf --version
          $files = Get-ChildItem -Path src -Recurse -Include *.cpp,*.h,*.hpp | Select-Object -ExpandProperty FullName
          foreach ($f in $files) { & $cf --style=file -i $f }
          $changed = git diff --name-only
          if ($changed) {
            Write-Host "clang-format violations in:"
            $changed | ForEach-Object { Write-Host "  $_" }
            git diff
            exit 1
          }

      - name: Install Cppcheck
        run: choco install cppcheck --no-progress -y

      - name: Run cppcheck
        run: |
          $files = Get-ChildItem -Path src -Recurse -Include *.cpp | Select-Object -ExpandProperty FullName
          & 'C:\Program Files\Cppcheck\cppcheck.exe' --language=c++ --std=c++20 --enable=warning,style,performance --error-exitcode=1 --quiet $files

      - name: Install Ninja
        run: choco install ninja --no-progress -y

      - uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c # v1.13.0
        with:
          arch: x64

      - name: Configure CMake (compile_commands.json for clang-tidy)
        # MSVC's default (Visual Studio) generator never emits compile_commands.json;
        # only Ninja/Makefiles generators do, hence Ninja + msvc-dev-cmd here.
        # CMAKE_CXX_SCAN_FOR_MODULES=OFF: this project has no C++20 modules, but CMake's
        # default Ninja+MSVC module scanning still injects "@*.obj.modmap" response-file
        # args into compile_commands.json, which clang-tidy's forced cl driver mode can't
        # resolve (fails to open the response file, corrupting subsequent arg parsing).
        run: cmake -B build/lint -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_CXX_SCAN_FOR_MODULES=OFF

      - name: Run clang-tidy
        run: |
          $ct = "$env:GITHUB_WORKSPACE\llvm\bin\clang-tidy.exe"
          & $ct --version
          $files = Get-ChildItem -Path src -Recurse -Include *.cpp | Select-Object -ExpandProperty FullName
          # Force cl driver mode + C++20 explicitly: compile_commands.json alone left clang-tidy
          # parsing as an older standard (std::wstring::starts_with, a C++20 member, was reported
          # missing even though the project targets C++20).
          # Both go through --extra-arg-before: a plain --extra-arg is appended after the
          # database's own args (including the trailing source file), so in cl driver mode
          # "/std:c++20" ends up parsed as a positional input file instead of a flag.
          & $ct --config-file=.clang-tidy -p build/lint --extra-arg-before=--driver-mode=cl --extra-arg-before=/std:c++20 $files


  build-debug:
    needs: lint
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Cache FetchContent dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/debug/_deps
          key: fetchcontent-debug-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: fetchcontent-debug-

      - name: Configure CMake
        run: cmake -B build/debug -A x64

      - name: Build
        run: cmake --build build/debug --config Debug --parallel

      - name: Run Tests
        working-directory: build/debug
        run: ctest -C Debug --output-on-failure

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-debug
          path: build/debug/Testing/

  build-release:
    needs: lint
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Cache FetchContent dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/release/_deps
          key: fetchcontent-release-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: fetchcontent-release-

      - name: Configure CMake
        run: cmake -B build/release -A x64

      - name: Build
        run: cmake --build build/release --config Release --parallel

      - name: Install OpenCppCoverage
        run: |
          choco install opencppcoverage --no-progress -y
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\OpenCppCoverage"

      - name: Run Tests with Coverage
        run: >
          OpenCppCoverage.exe
          --sources "${{ github.workspace }}\src"
          --export_type=cobertura:build/release/coverage.xml
          -- ctest --test-dir build/release -C Release --output-on-failure

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@0f8570b1a125f4937846a11fcfa3bcd548bd8c97 # v4.6.0
        with:
          files: build/release/coverage.xml
          fail_ci_if_error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-release
          path: build/release/Testing/

  build-asan:
    needs: lint
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Cache FetchContent dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/asan/_deps
          key: fetchcontent-asan-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: fetchcontent-asan-

      - name: Configure CMake (ASAN Debug)
        run: >
          cmake -B build/asan -A x64
          -DENABLE_ASAN=ON
          -DCMAKE_CXX_FLAGS_DEBUG="/Ob0 /Od"

      - name: Build
        run: cmake --build build/asan --config Debug --parallel

      - name: Add MSVC ASAN runtime to PATH
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          $msvcBin = (Get-ChildItem "$vsPath\VC\Tools\MSVC" |
            Sort-Object Name -Descending | Select-Object -First 1).FullName + "\bin\Hostx64\x64"
          Add-Content $env:GITHUB_PATH $msvcBin

      - name: Test (ASAN)
        working-directory: build/asan
        env:
          ASAN_OPTIONS: "halt_on_error=1:abort_on_error=1"
        # Exclude OS-level storage tests that may produce false positives from Win32 APIs
        run: ctest -C Debug --output-on-failure -E "DriveEnumerator|Indexer"

  benchmark:
    needs: lint
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Cache FetchContent dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/benchmark/_deps
          key: fetchcontent-benchmark-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: fetchcontent-benchmark-

      - name: Restore benchmark history
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: benchmark-results
          key: benchmark-history-${{ github.run_id }}
          restore-keys: benchmark-history-

      - name: Configure CMake
        run: cmake -B build/benchmark -A x64 -DBUILD_BENCHMARKS=ON

      - name: Build
        run: cmake --build build/benchmark --config Release --target winindex_benchmarks --parallel

      - name: Run benchmarks
        run: |
          New-Item -ItemType Directory -Force -Path benchmark-results | Out-Null
          $sha = $env:GITHUB_SHA.Substring(0,7)
          $stamp = Get-Date -Format 'yyyyMMdd-HHmmss'
          & build\benchmark\Release\winindex_benchmarks.exe `
            --benchmark_out="benchmark-results\$stamp-$sha-$($env:GITHUB_RUN_ID).json" `
            --benchmark_out_format=json

      - name: Render trend into job summary
        run: python scripts/render_benchmark_trend.py benchmark-results | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Save benchmark history
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: benchmark-results
          key: benchmark-history-${{ github.run_id }}

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-results
          path: benchmark-results/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-debug, build-release]
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Cache FetchContent dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/_deps
          key: fetchcontent-release-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: fetchcontent-release-

      - name: Configure CMake
        run: cmake -B build -A x64 -DCMAKE_INSTALL_PREFIX=install

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Install
        run: cmake --install build --config Release

      - name: Package (ZIP portable)
        run: cpack -G ZIP -C Release
        working-directory: build

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Package (NSIS installer)
        run: cpack -G NSIS -C Release
        working-directory: build

      - name: Generate checksums
        working-directory: build
        run: |
          Get-ChildItem -Include *.zip,*.exe -File | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Append -Encoding ascii SHA256SUMS.txt
          }

      - name: Upload Release Assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            build/*.zip
            build/*.exe
            build/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
